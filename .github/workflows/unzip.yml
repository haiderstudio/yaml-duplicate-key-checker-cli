name: Unzip publish files
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract zip and publish files
        run: |
          ls -la
          unzip -o ./*.zip
          ls -la
          for d in */; do
            if [ -f "$d/README.md" ] || [ -d "$d/src" ]; then
              shopt -s dotglob
              mv "$d"* ./
              rmdir "$d"
            fi
          done
          ls -R | head -n 300
          echo "=== CI FILE ==="
          cat .github/workflows/ci.yml
          echo "=== END CI FILE ==="
          mkdir -p /tmp/hold
          mv .github/workflows/ci.yml /tmp/hold/ci.yml
          rm -f ./*.zip
          rm -f .github/workflows/unzip.yml
          git config user.name "haiderstudio"
          git config user.email "haiderstudio@users.noreply.github.com"
          git add -A -f
          git status --short
          git commit -m "Publish exact project files" || echo "nothing to commit"
          git push origin HEAD:main
