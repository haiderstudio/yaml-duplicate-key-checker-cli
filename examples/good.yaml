# A clean config file. Nothing here is a duplicate.
app:
  name: my-app
  version: 1.2.3
  debug: false
server:
  host: localhost
  port: 8080
  # The same key name at a different level is fine.
  name: main-server
features:
  - name: search
    enabled: true
  - name: export
    enabled: false
notes: |
  This block scalar can hold lines
  that look like keys: but they are not keys.
description: "a quoted value with: a colon inside"
